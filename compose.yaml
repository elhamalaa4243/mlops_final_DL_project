services:
  pet-breed:
    build: .
    image: pet-breed:latest
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      MODEL_CHECKPOINT: /app/models/frozen/resnet18_v1.pt
      MODEL_CLASSES: /app/data/processed/classes.json
      MODEL_CALIBRATION: /app/models/frozen/calibration.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
