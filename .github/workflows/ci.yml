
name: Pet Breed MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python Tests and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-serving.txt
            requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e .

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Run unit tests
        run: python -m pytest -q -m "not integration"

      - name: Model Quality Gate
        run: |
          python scripts/check_model_quality.py \
            --candidate reports/dvc_metrics.json \
            --baseline config/model_quality_baseline.json