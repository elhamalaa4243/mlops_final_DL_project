apiVersion: 1

groups:
  - orgId: 1
    name: petbreed-drift-alerts
    folder: MLOps
    interval: 1m
    rules:
      - uid: petbreed-drift-alert
        title: Pet Breed - Data Drift Detected
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Data drift detected in the latest Pet Breed scoring batch
          description: >
            Embedding, confidence, or pixel drift exceeded its calibrated
            threshold in a completed batch less than 24 hours old.
        labels:
          severity: warning
          project: pet-breed-mlops
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: petbreed-prometheus
            model:
              datasource:
                type: prometheus
                uid: petbreed-prometheus
              editorMode: code
              expr: 'petbreed_drift_detected * on(job,instance) (petbreed_drift_report_available == 1) * on(job,instance) (time() - petbreed_drift_batch_timestamp_seconds < bool 86400)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings:
                mode: dropNN

          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
